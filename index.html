    async function getPublicIp() {
      const response = await fetch("https://api64.ipify.org?format=json", {
        cache: "no-store"
      });

      if (!response.ok) {
        throw new Error("Falha ao consultar IP.");
      }

      const data = await response.json();
      if (!data.ip) throw new Error("IP não retornado.");
      return data.ip;
    }

    async function register() {
      const status = document.getElementById("status");
      const spinner = document.querySelector(".spinner");

      try {
        const ip = await getPublicIp();

        const response = await fetch("/api/register-ip", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ip })
        });

        const data = await response.json().catch(() => ({}));

          throw new Error(
            data?.baserowError?.detail ||
            data?.baserowError?.error ||
            data?.error ||
            "Falha ao registrar."
          );
        }

          console.warn(data.warning, data.dateFieldError || "");
