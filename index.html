<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Carregando...</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0b1020;
      color: #fff;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .box {
      width: min(90vw, 420px);
      text-align: center;
      padding: 28px;
    }
    .spinner {
      width: 34px;
      height: 34px;
      margin: 0 auto 18px;
      border: 3px solid rgba(255,255,255,.18);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #status {
      opacity: .78;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main class="box">
    <div class="spinner"></div>
    <div id="status">Carregando...</div>
  </main>

  <script>
    async function getPublicIp() {
      const response = await fetch("https://api64.ipify.org?format=json", {
        cache: "no-store"
      });

      if (!response.ok) {
        throw new Error("Falha ao consultar IP.");
      }

      const data = await response.json();
      if (!data.ip) throw new Error("IP não retornado.");
      return data.ip;
    }

    async function register() {
      const status = document.getElementById("status");

      try {
        const ip = await getPublicIp();

        const response = await fetch("/api/register-ip", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ip })
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(data.error || "Falha ao registrar.");
        }

        status.textContent = "Concluído.";
        document.querySelector(".spinner").style.display = "none";
      } catch (error) {
        console.error(error);
        status.textContent = "Página carregada.";
        document.querySelector(".spinner").style.display = "none";
      }
    }

    register();
  </script>
</body>
</html>
