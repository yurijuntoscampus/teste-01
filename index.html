<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>Carregando...</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0b1020;
      color: #fff;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .box { width: min(90vw, 460px); text-align: center; padding: 28px; }
    .spinner {
      width: 34px; height: 34px; margin: 0 auto 18px;
      border: 3px solid rgba(255,255,255,.18);
      border-top-color: #fff; border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #status { opacity: .78; font-size: 14px; line-height: 1.5; }
  </style>
</head>
<body>
  <main class="box">
    <div class="spinner"></div>
    <div id="status">Carregando...</div>
  </main>

  <script>
    async function getPublicIp() {
      const response = await fetch("https://api64.ipify.org?format=json", {
        cache: "no-store"
      });

      if (!response.ok) {
        throw new Error("Falha ao consultar IP.");
      }

      const data = await response.json();
      if (!data.ip) throw new Error("IP não retornado.");
      return data.ip;
    }

    async function register() {
      const status = document.getElementById("status");
      const spinner = document.querySelector(".spinner");

      try {
        const ip = await getPublicIp();

        const response = await fetch("/api/register-ip", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ ip })
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          console.error("ERRO COMPLETO DO BACKEND:", data);
          throw new Error(
            data?.baserowError?.detail ||
            data?.baserowError?.error ||
            data?.error ||
            "Falha ao registrar."
          );
        }

        console.log("Registro realizado:", data);

        if (data.warning) {
          console.warn(data.warning, data.dateFieldError || "");
        }

        status.textContent = "Concluído.";
      } catch (error) {
        console.error("Erro:", error);
        status.textContent = "Página carregada.";
      } finally {
        spinner.style.display = "none";
      }
    }

    register();
  </script>
</body>
</html>
